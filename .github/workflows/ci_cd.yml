name: CI de l'API

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  ci:
    name: 🚀 Build | 🧪 Tests | 🐳 Docker
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start PostGIS
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test_db \
            -p 5432:5432 \
            postgis/postgis:15-3.4-alpine

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if PGPASSWORD=test psql -h localhost -U test -d test_db -c "SELECT 1" > /dev/null 2>&1; then
              echo "✅ Postgres prêt"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Postgres KO"
          docker logs postgres
          exit 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 🔥 VARIABLES D'ENV COMPLÈTES POUR SPRING
      - name: Set ENV
        run: |
          # ───── DB ─────
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/test_db" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_USERNAME=test" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_PASSWORD=test" >> $GITHUB_ENV

          echo "SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop" >> $GITHUB_ENV
          echo "SPRING_FLYWAY_ENABLED=false" >> $GITHUB_ENV

          # ───── AI / GROQ ─────
          echo "GROQ_API_KEY=fake-key-for-ci" >> $GITHUB_ENV

          # ───── SUPABASE ─────
          echo "SUPABASE_URL=https://fake.supabase.co" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=fake-service-key" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=fake-anon-key" >> $GITHUB_ENV

          # ───── APP CONFIG (AppProperties) ─────
          echo "API_URL=http://localhost:8080" >> $GITHUB_ENV

          echo "ADMIN_USER_ID=ci-admin" >> $GITHUB_ENV
          echo "ADMIN_BASE_PATH=/admin-8f2k9x" >> $GITHUB_ENV

          # ───── COOKIE ─────
          echo "APP_COOKIE_SECURE=false" >> $GITHUB_ENV
          echo "APP_COOKIE_SAME_SITE=Lax" >> $GITHUB_ENV

          # ───── THYMELEAF ─────
          echo "THYMELEAF_CACHE=false" >> $GITHUB_ENV

          # ───── CORS ─────
          echo "CORS_ALLOWED_ORIGINS=http://localhost:5173" >> $GITHUB_ENV

      - name: Build
        run: mvn clean install -DskipTests

      - name: Tests
        run: mvn test -Dspring.profiles.active=test

      - name: Docker build
        run: docker build -t app-ci-test .

  cd:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Deploy via Render Deploy Hook
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}