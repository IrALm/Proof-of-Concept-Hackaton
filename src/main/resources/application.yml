server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.1-8b-instant}
          temperature: 0.35

  # ─── Upload CSV (back-office) ──────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # ─── Thymeleaf (back-office) ───────────────────────────────────────
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}   # false en dev, true en prod (défaut)
    prefix: classpath:/templates/
    suffix: .html

app:
  supabase:
    url: ${SUPABASE_URL}
    key: ${SUPABASE_KEY}
    anon-key: ${SUPABASE_ANON_KEY}
    service-key: ${SUPABASE_SERVICE_KEY}

  groq:
    api-key: ${GROQ_API_KEY}

  pexels:
    api-key: ${PEXELS_API_KEY}

  # ─── Back-office admin ─────────────────────────────────────────────
  admin:
    user-id: ${ADMIN_USER_ID}
    base-path: /admin-8f2k9x

  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
    max-age: 1209600
  api:
    url: ${API_URL}

  cors:
    allowed-origins:
      - http://localhost:5173
      - https://ton-app.vercel.app
