<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Back Office</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">

  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-gray-900">🔐 Back Office</h1>
    <p class="text-sm text-gray-500 mt-2">Accès restreint administrateur</p>
  </div>

  <!-- Erreur -->
  <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4 text-sm"
       th:text="${error}">Error</div>

  <form th:action="${basePath} + '/login'" method="post" class="space-y-4">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email" required autofocus
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
      <input type="password" name="password" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent">
    </div>

    <button type="submit"
            class="w-full bg-gray-900 text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition">
      Se connecter
    </button>
  </form>

</div>

</body>
</html>
